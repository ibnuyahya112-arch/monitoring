<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Online - TAG I BALARAJA</title>
  <meta name="description" content="Sistem Monitoring Order & Barang Silang PB Auto - TAG I BALARAJA">
  <meta name="theme-color" content="#060913">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #060913;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #060913;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Layar Loading saat Google Apps Script sedang memuat */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #060913;
      color: #00e5ff;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 14px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
    }

    .loader-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .loader-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
      letter-spacing: 0.8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-title">MONITORING ONLINE</div>
    <div class="loader-sub">TAG I BALARAJA</div>
  </div>

  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbxjXaf1dEECGorIn1KgF7UPgaWY4659SRbiX743i5pJrIZ7uRtO-2U7e8KbGNrt_5GS1g/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      onload="hideLoader()">
    </iframe>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 400);
      }
    }
  </script>

</body>
</html>
